<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Control v5.3 - Piloto Automático</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass-panel { background: #1e293b; border: 1px solid #334155; }
        .input-clean { background: #0f172a; border: 1px solid #334155; transition: all 0.2s; }
        .input-clean:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .loader { border-top-color: transparent; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Toggle Switch CSS */
        .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #475569; transition: all 0.3s; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

<div class="glass-panel max-w-4xl w-full p-8 rounded-2xl shadow-2xl relative overflow-hidden h-fit">
    
    <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Sniper Control</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">V5.3 - Piloto Automático 24/7</p>
        </div>
        <button type="button" onclick="toggleConfig()" class="text-slate-400 hover:text-white transition-colors">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </div>

    <form id="disparoForm" class="space-y-8">
        
        <div id="configArea" class="hidden absolute inset-0 bg-slate-900/98 z-50 p-8 flex flex-col justify-center backdrop-blur-sm">
            <h3 class="text-xl font-bold mb-6">Credenciais da API</h3>
            <div class="space-y-4">
                <input type="text" id="ghUser" class="w-full input-clean rounded-lg p-3 text-sm text-white" placeholder="Utilizador GitHub">
                <input type="text" id="ghRepo" class="w-full input-clean rounded-lg p-3 text-sm text-white" placeholder="Repositório">
                <input type="password" id="ghToken" class="w-full input-clean rounded-lg p-3 text-sm text-white" placeholder="Token PAT">
            </div>
            <div class="mt-6 flex gap-3">
                <button type="button" onclick="toggleConfig()" class="flex-1 bg-slate-800 p-3 rounded-lg font-medium text-sm">Cancelar</button>
                <button type="button" onclick="saveConfig()" class="flex-1 bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-medium text-sm transition-colors">Guardar</button>
            </div>
        </div>

        <section class="space-y-4">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wide border-b border-slate-800 pb-2">1. Extração e Vídeo</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">URL Scraping <span class="text-blue-400">(Vazio = Sorteio Auto)</span></label>
                    <input type="url" id="videoUrl" class="w-full input-clean rounded-lg p-3 text-sm" placeholder="Deixe em branco para modo automático...">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">OU Mídia Própria (Link Direto MP4/JPG)</label>
                    <input type="url" id="customMediaUrl" class="w-full input-clean rounded-lg p-3 text-sm" placeholder="Link do seu ficheiro...">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                <div class="col-span-1">
                    <label class="block text-xs text-slate-400 mb-1">Qtd.</label>
                    <input type="number" id="scrapeLimit" min="1" max="10" value="5" class="w-full input-clean rounded-lg p-3 text-sm">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs text-slate-400 mb-1">Tamanho</label>
                    <select id="videoDuration" class="w-full input-clean rounded-lg p-3 text-sm">
                        <option value="teaser">Teaser (15s)</option>
                        <option value="full">Completo</option>
                    </select>
                </div>
                <div class="col-span-4">
                    <label class="block text-xs text-slate-400 mb-1">Marca D'água (Texto, Posição e Fonte)</label>
                    <div class="flex gap-2">
                        <input type="text" id="watermarkText" class="w-full input-clean rounded-lg p-3 text-sm" placeholder="Ex: @SeuCanal">
                        <select id="watermarkPos" class="w-1/3 input-clean rounded-lg p-3 text-sm">
                            <option value="bottom_right">Baixo Direita</option>
                            <option value="bottom_left">Baixo Esquerda</option>
                            <option value="top_right">Topo Direita</option>
                            <option value="top_left">Topo Esquerda</option>
                            <option value="center">Centro</option>
                        </select>
                        <select id="watermarkSize" class="w-1/3 input-clean rounded-lg p-3 text-sm">
                            <option value="16">Pequeno</option>
                            <option value="28" selected>Médio</option>
                            <option value="42">Grande</option>
                            <option value="60">Gigante</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wide border-b border-slate-800 pb-2">2. Estrutura da Postagem</h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                <div class="flex flex-col items-center justify-center">
                    <label class="text-xs text-slate-400 mb-2 font-bold uppercase">Spoiler / Borrar</label>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" id="useSpoiler" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="useSpoiler" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex flex-col items-center justify-center">
                    <label class="text-xs text-slate-400 mb-2 font-bold uppercase">Puxar Título Original</label>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" id="useTitle" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="useTitle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs text-slate-400 mb-1 font-bold uppercase">Formato de Envio</label>
                    <select id="sendMode" class="w-full input-clean rounded-lg p-3 text-sm border-blue-500/30">
                        <option value="single">Uma de Cada Vez (Vídeo + Botões Juntos)</option>
                        <option value="gallery">Galeria (Álbum acima, Botões Separados abaixo)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">ID do Grupo Telegram (Opcional)</label>
                <input type="text" id="chatId" class="w-full input-clean rounded-lg p-3 text-sm" placeholder="Ex: -100123456789">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Copy Principal <span class="text-blue-400">(Vazio = Sorteio Auto)</span></label>
                <textarea id="captionText" rows="3" class="w-full input-clean rounded-lg p-3 text-sm" placeholder="A sua copy de conversão aqui. Deixe em branco para usar o banco de textos automático..."></textarea>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex justify-between items-end border-b border-slate-800 pb-2">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wide">3. Botões CTA <span class="text-blue-400 text-xs normal-case">(Vazio = Auto)</span></h2>
                <button type="button" onclick="addButton()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-blue-400 font-medium transition-colors">
                    + Botão
                </button>
            </div>
            <div id="buttonsContainer" class="space-y-3"></div>
        </section>

        <button type="submit" id="btnEnviar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-lg py-4 transition-all shadow-lg shadow-blue-900/20 active:scale-[0.98]">
            <span id="btnText">EXECUTAR DISPARO</span>
            <div id="loadingSpinner" class="hidden flex items-center justify-center gap-3">
                <div class="w-5 h-5 border-2 border-white rounded-full loader"></div>
                <span class="text-sm">A PROCESSAR...</span>
            </div>
        </button>
    </form>
    <div id="statusMsg" class="mt-4 text-xs hidden p-3 rounded-lg font-medium text-center"></div>
</div>

<script>
    let dynamicButtons = []; // Começa vazio para permitir o uso do Banco de Dados Automático por defeito

    function renderButtons() {
        const container = document.getElementById('buttonsContainer');
        container.innerHTML = '';
        if (dynamicButtons.length === 0) {
            container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2 border border-dashed border-slate-700 rounded-lg">A usar botões automáticos do sistema. Adicione um botão para substituir.</p>';
        } else {
            dynamicButtons.forEach((btn, index) => {
                container.innerHTML += `
                    <div class="flex gap-2 items-center bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                        <input type="text" value="${btn.name}" oninput="updateBtn(${index}, 'name', this.value)" class="flex-1 input-clean rounded p-2 text-xs" placeholder="Nome do Botão">
                        <input type="url" value="${btn.url}" oninput="updateBtn(${index}, 'url', this.value)" class="flex-2 input-clean rounded p-2 text-xs w-1/2" placeholder="Link (URL)">
                        <button type="button" onclick="removeButton(${index})" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }
    }

    function updateBtn(index, field, value) { dynamicButtons[index][field] = value; }
    function addButton() { dynamicButtons.push({ name: "Novo Botão", url: "" }); renderButtons(); }
    function removeButton(index) { dynamicButtons.splice(index, 1); renderButtons(); }

    window.onload = () => {
        ['ghUser', 'ghRepo', 'ghToken', 'chatId', 'captionText', 'watermarkText'].forEach(f => {
            if(localStorage.getItem(f)) document.getElementById(f).value = localStorage.getItem(f);
        });
        const savedBtns = localStorage.getItem('dynamicButtons');
        if(savedBtns) dynamicButtons = JSON.parse(savedBtns);
        
        if(localStorage.getItem('watermarkPos')) document.getElementById('watermarkPos').value = localStorage.getItem('watermarkPos');
        if(localStorage.getItem('watermarkSize')) document.getElementById('watermarkSize').value = localStorage.getItem('watermarkSize');
        if(localStorage.getItem('sendMode')) document.getElementById('sendMode').value = localStorage.getItem('sendMode');
        
        document.getElementById('useSpoiler').checked = localStorage.getItem('useSpoiler') !== 'false';
        document.getElementById('useTitle').checked = localStorage.getItem('useTitle') !== 'false';

        renderButtons();
    };

    function toggleConfig() { document.getElementById('configArea').classList.toggle('hidden'); }

    function saveConfig() {
        const user = document.getElementById('ghUser').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();
        localStorage.setItem('ghUser', user);
        localStorage.setItem('ghRepo', repo);
        localStorage.setItem('ghToken', token);
        toggleConfig();
        showStatus('Credenciais Guardadas!', 'success');
    }

    document.getElementById('disparoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = localStorage.getItem('ghUser');
        const repo = localStorage.getItem('ghRepo');
        const token = localStorage.getItem('ghToken');
        
        if(!user || !repo || !token) { showStatus('Erro: Configure a API primeiro.', 'error'); return; }

        const validButtons = dynamicButtons.filter(b => b.name && b.url);

        const appPayload = {
            video_url: document.getElementById('videoUrl').value.trim(),
            custom_media_url: document.getElementById('customMediaUrl').value.trim(),
            scrape_limit: parseInt(document.getElementById('scrapeLimit').value) || 5,
            video_duration: document.getElementById('videoDuration').value,
            watermark_text: document.getElementById('watermarkText').value.trim(),
            watermark_pos: document.getElementById('watermarkPos').value,
            watermark_size: document.getElementById('watermarkSize').value,
            use_spoiler: document.getElementById('useSpoiler').checked,
            use_title: document.getElementById('useTitle').checked,
            send_mode: document.getElementById('sendMode').value,
            chat_id: document.getElementById('chatId').value.trim(),
            caption_text: document.getElementById('captionText').value.trim(),
            dynamic_buttons: validButtons
        };

        // As travas de erro foram retiradas para permitir disparos totalmente vazios (Modo Automático/Sorteio)

        localStorage.setItem('chatId', appPayload.chat_id);
        localStorage.setItem('captionText', appPayload.caption_text);
        localStorage.setItem('watermarkText', appPayload.watermark_text);
        localStorage.setItem('watermarkPos', appPayload.watermark_pos);
        localStorage.setItem('watermarkSize', appPayload.watermark_size);
        localStorage.setItem('sendMode', appPayload.send_mode);
        localStorage.setItem('useSpoiler', appPayload.use_spoiler);
        localStorage.setItem('useTitle', appPayload.use_title);
        localStorage.setItem('dynamicButtons', JSON.stringify(validButtons));

        setLoading(true);
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`, {
                method: 'POST',
                headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${token}` },
                body: JSON.stringify({ 
                    event_type: 'iniciar_disparo', 
                    client_payload: { config_data: JSON.stringify(appPayload) } 
                })
            });

            if (response.status === 204) { showStatus('✅ Comando enviado para o servidor! O bot irá agir conforme a configuração.', 'success'); } 
            else { const data = await response.json(); showStatus(`❌ Erro: ${data.message}`, 'error'); }
        } catch (error) { showStatus(`❌ Erro de Rede.`, 'error'); } finally { setLoading(false); }
    });

    function setLoading(isLoading) {
        document.getElementById('btnEnviar').disabled = isLoading;
        document.getElementById('btnText').classList.toggle('hidden', isLoading);
        document.getElementById('loadingSpinner').classList.toggle('hidden', !isLoading);
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = `mt-4 text-xs p-3 rounded-lg font-medium text-center ${type === 'success' ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}`;
        el.classList.remove('hidden');
    }
</script>
</body>
</html>
