<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Control V5.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #cbd5e1; font-family: sans-serif; }
        .panel-bg { background-color: #1e293b; }
        .input-bg { background-color: #0f172a; border: 1px solid #334155; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="panel-bg rounded-lg shadow-xl w-full max-w-3xl p-8">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Sniper Control</h1>
                <p class="text-xs text-slate-400">V5.3 - PILOTO AUTOMÁTICO 24/7</p>
            </div>
            <span class="text-slate-400 cursor-pointer">⚙️</span>
        </div>

        <form id="sniperForm" class="space-y-6">
            <!-- 1. EXTRAÇÃO E VÍDEO -->
            <div>
                <h2 class="text-sm font-bold text-white mb-3">1. EXTRAÇÃO E VÍDEO</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">URL Scraping (Vazio = Sorteio Auto)</label>
                        <input type="text" id="url_scraping" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="https://www.erome.com/a/...">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">OU Mídia Própria (Link Direto MP4/JPG)</label>
                        <input type="text" id="media_propria" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="Link do seu ficheiro...">
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-4 mt-4">
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Qtd.</label>
                        <input type="number" id="qtd" value="1" class="input-bg w-full p-2 text-sm rounded text-white">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Tamanho</label>
                        <select id="tamanho" class="input-bg w-full p-2 text-sm rounded text-white">
                            <option>Completo</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs mb-1 text-slate-400">Marca D'água (Texto, Posição e Fonte)</label>
                        <input type="text" id="watermark_text" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="Ex: @SeuCanal">
                    </div>
                </div>
            </div>

            <!-- 2. ESTRUTURA DA POSTAGEM -->
            <div>
                <h2 class="text-sm font-bold text-white mb-3">2. ESTRUTURA DA POSTAGEM</h2>
                <div class="panel-bg border border-slate-700 p-4 rounded-lg flex items-center justify-between mb-4">
                    <div class="flex flex-col items-center">
                        <label class="text-xs text-slate-400 mb-2">SPOILER / BORRAR</label>
                        <input type="checkbox" id="spoiler" class="toggle-checkbox">
                    </div>
                    <div class="flex flex-col items-center">
                        <label class="text-xs text-slate-400 mb-2">PUXAR TÍTULO ORIGINAL</label>
                        <input type="checkbox" id="puxar_titulo" class="toggle-checkbox" checked>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-slate-400 mb-2 block">FORMATO DE ENVIO</label>
                        <select id="formato_envio" class="input-bg w-full p-2 text-sm rounded text-white">
                            <option>Uma de Cada Vez (Vídeo + Botões Juntos)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs mb-1 text-slate-400">ID do Grupo Telegram (Opcional)</label>
                    <input type="text" id="chat_id" class="input-bg w-full p-2 text-sm rounded text-white" value="-1003972594490">
                </div>

                <div class="mt-4">
                    <label class="block text-xs mb-1 text-slate-400">Copy Principal (Vazio = Sorteio Auto)</label>
                    <textarea id="copy_principal" rows="3" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="A sua copy de conversão aqui..."></textarea>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg mt-6 transition">
                EXECUTAR DISPARO
            </button>
            <div id="statusMsg" class="hidden text-center mt-3 text-sm text-green-400">
                ✅ Comando enviado para o servidor! O bot irá agir conforme a configuração.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('sniperForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Reúne todas as variáveis do formulário
            const configData = {
                url_scraping: document.getElementById('url_scraping').value.trim(),
                media_propria: document.getElementById('media_propria').value.trim(),
                qtd: document.getElementById('qtd').value,
                tamanho: document.getElementById('tamanho').value,
                watermark_text: document.getElementById('watermark_text').value,
                spoiler: document.getElementById('spoiler').checked,
                puxar_titulo: document.getElementById('puxar_titulo').checked,
                formato_envio: document.getElementById('formato_envio').value,
                chat_id: document.getElementById('chat_id').value,
                copy_principal: document.getElementById('copy_principal').value
            };

            const statusMsg = document.getElementById('statusMsg');
            
            try {
                // DISPARO PARA O GITHUB ACTIONS
                // ATENÇÃO: Preencha com os dados do seu repositório de back-end
                const response = await fetch('https://api.github.com/repos/SEU_USUARIO/NOME_DO_REPO/dispatches', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': 'token SEU_TOKEN_GITHUB_AQUI',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'iniciar_disparo',
                        client_payload: {
                            config_data: JSON.stringify(configData) // Envia tudo como string JSON
                        }
                    })
                });

                if (response.ok) {
                    statusMsg.classList.remove('hidden');
                    statusMsg.classList.replace('text-red-400', 'text-green-400');
                    statusMsg.innerText = '✅ Comando enviado para o servidor! O bot irá agir conforme a configuração.';
                } else {
                    throw new Error('Falha ao enviar webhook');
                }
            } catch (error) {
                statusMsg.classList.remove('hidden');
                statusMsg.classList.replace('text-green-400', 'text-red-400');
                statusMsg.innerText = '❌ Erro ao conectar com o servidor.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
