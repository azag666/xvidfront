<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Control V5.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #cbd5e1; font-family: sans-serif; }
        .panel-bg { background-color: #1e293b; }
        .input-bg { background-color: #0f172a; border: 1px solid #334155; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">

    <div class="panel-bg rounded-lg shadow-xl w-full max-w-3xl p-8 relative overflow-hidden">
        
        <div id="configArea" class="hidden absolute inset-0 bg-slate-900/95 z-50 p-8 flex flex-col justify-center backdrop-blur-sm">
            <h3 class="text-xl font-bold text-white mb-6">Credenciais da API (Salvas no seu Navegador)</h3>
            <div class="space-y-4">
                <input type="text" id="ghUser" class="input-bg w-full p-3 rounded text-white text-sm" placeholder="Usuário GitHub (ex: azag666)">
                <input type="text" id="ghRepo" class="input-bg w-full p-3 rounded text-white text-sm" placeholder="Repositório (ex: xvid)">
                <input type="password" id="ghToken" class="input-bg w-full p-3 rounded text-white text-sm" placeholder="Token PAT (ghp_...)">
            </div>
            <div class="mt-6 flex gap-3">
                <button type="button" onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-medium text-white">Cancelar</button>
                <button type="button" onclick="saveConfig()" class="flex-1 bg-green-600 hover:bg-green-500 p-3 rounded-lg font-medium text-white">Salvar Seguro</button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Sniper Control</h1>
                <p class="text-xs text-slate-400">V5.3 - PILOTO AUTOMÁTICO 24/7</p>
            </div>
            <button onclick="toggleConfig()" class="text-slate-400 hover:text-white cursor-pointer text-xl">⚙️</button>
        </div>

        <form id="sniperForm" class="space-y-6">
            <div>
                <h2 class="text-sm font-bold text-white mb-3">1. EXTRAÇÃO E VÍDEO</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">URL Scraping (Vazio = Sorteio Auto)</label>
                        <input type="text" id="url_scraping" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="https://www.erome.com/...">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">OU Mídia Própria (Link Direto MP4/JPG)</label>
                        <input type="text" id="media_propria" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="Link do seu ficheiro...">
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-4 mt-4">
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Qtd.</label>
                        <input type="number" id="qtd" value="1" class="input-bg w-full p-2 text-sm rounded text-white">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Tamanho</label>
                        <select id="tamanho" class="input-bg w-full p-2 text-sm rounded text-white">
                            <option>Completo</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs mb-1 text-slate-400">Marca D'água (Texto, Posição e Fonte)</label>
                        <input type="text" id="watermark_text" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="Ex: @SeuCanal">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-bold text-white mb-3">2. ESTRUTURA DA POSTAGEM</h2>
                <div class="panel-bg border border-slate-700 p-4 rounded-lg flex items-center justify-between mb-4">
                    <div class="flex flex-col items-center">
                        <label class="text-xs text-slate-400 mb-2">SPOILER / BORRAR</label>
                        <input type="checkbox" id="spoiler" class="toggle-checkbox">
                    </div>
                    <div class="flex flex-col items-center">
                        <label class="text-xs text-slate-400 mb-2">PUXAR TÍTULO ORIGINAL</label>
                        <input type="checkbox" id="puxar_titulo" class="toggle-checkbox" checked>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-slate-400 mb-2 block">FORMATO DE ENVIO</label>
                        <select id="formato_envio" class="input-bg w-full p-2 text-sm rounded text-white">
                            <option>Uma de Cada Vez (Vídeo + Botões Juntos)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs mb-1 text-slate-400">ID do Grupo Telegram (Opcional)</label>
                    <input type="text" id="chat_id" class="input-bg w-full p-2 text-sm rounded text-white" value="-1003972594490">
                </div>

                <div class="mt-4">
                    <label class="block text-xs mb-1 text-slate-400">Copy Principal (Vazio = Sorteio Auto)</label>
                    <textarea id="copy_principal" rows="3" class="input-bg w-full p-2 text-sm rounded text-white" placeholder="A sua copy de conversão aqui..."></textarea>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg mt-6 transition">
                EXECUTAR DISPARO
            </button>
            <div id="statusMsg" class="hidden text-center mt-3 text-sm font-bold"></div>
        </form>
    </div>

    <script>
        // Funções para carregar e salvar credenciais seguras no navegador
        window.onload = () => {
            if(localStorage.getItem('ghUser')) document.getElementById('ghUser').value = localStorage.getItem('ghUser');
            if(localStorage.getItem('ghRepo')) document.getElementById('ghRepo').value = localStorage.getItem('ghRepo');
            if(localStorage.getItem('ghToken')) document.getElementById('ghToken').value = localStorage.getItem('ghToken');
        };

        function toggleConfig() {
            document.getElementById('configArea').classList.toggle('hidden');
        }

        function saveConfig() {
            localStorage.setItem('ghUser', document.getElementById('ghUser').value.trim());
            localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
            toggleConfig();
            
            const msg = document.getElementById('statusMsg');
            msg.classList.remove('hidden', 'text-red-400');
            msg.classList.add('text-green-400');
            msg.innerText = '✅ Credenciais salvas com segurança no navegador!';
        }

        // Função de envio do formulário
        document.getElementById('sniperForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = localStorage.getItem('ghUser');
            const repo = localStorage.getItem('ghRepo');
            const token = localStorage.getItem('ghToken');
            const statusMsg = document.getElementById('statusMsg');

            if (!user || !repo || !token) {
                statusMsg.classList.remove('hidden', 'text-green-400');
                statusMsg.classList.add('text-red-400');
                statusMsg.innerText = '❌ Erro: Clique na engrenagem e configure a API primeiro.';
                return;
            }

            const configData = {
                url_scraping: document.getElementById('url_scraping').value.trim(),
                media_propria: document.getElementById('media_propria').value.trim(),
                qtd: document.getElementById('qtd').value,
                tamanho: document.getElementById('tamanho').value,
                watermark_text: document.getElementById('watermark_text').value,
                spoiler: document.getElementById('spoiler').checked,
                puxar_titulo: document.getElementById('puxar_titulo').checked,
                formato_envio: document.getElementById('formato_envio').value,
                chat_id: document.getElementById('chat_id').value,
                copy_principal: document.getElementById('copy_principal').value
            };

            statusMsg.classList.remove('hidden', 'text-green-400', 'text-red-400');
            statusMsg.classList.add('text-slate-400');
            statusMsg.innerText = '⏳ Enviando comando...';
            
            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'iniciar_disparo',
                        client_payload: {
                            config_data: JSON.stringify(configData)
                        }
                    })
                });

                if (response.ok) {
                    statusMsg.classList.replace('text-slate-400', 'text-green-400');
                    statusMsg.innerText = '✅ Comando enviado para o servidor! O bot irá agir conforme a configuração.';
                } else {
                    throw new Error(`Falha na API. Verifique se o Token tem permissão 'repo'`);
                }
            } catch (error) {
                statusMsg.classList.replace('text-slate-400', 'text-red-400');
                statusMsg.innerText = '❌ Erro ao conectar. Verifique se as credenciais estão corretas na engrenagem.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
