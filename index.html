<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SniperExtract v3.5 - Corrigido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f1f5f9; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.3); }
        .loader { border-top-color: #ef4444; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .bg-grid { background-image: radial-gradient(circle at 1px 1px, rgba(239, 68, 68, 0.15) 1px, transparent 0); background-size: 30px 30px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 bg-grid">

<div class="glass max-w-lg w-full p-8 rounded-[2rem] shadow-2xl relative overflow-hidden border-t-4 border-t-red-600">
    <div class="text-center mb-10 relative z-10">
        <div class="bg-red-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-red-600/40">
            <i class="fa-solid fa-bolt text-2xl text-white"></i>
        </div>
        <h1 class="text-3xl font-black text-white tracking-tighter uppercase italic">Sniper<span class="text-red-600">Extract</span></h1>
    </div>

    <form id="disparoForm" class="space-y-5 relative z-10">
        <div id="configArea" class="hidden absolute inset-0 bg-slate-950/98 z-30 flex flex-col justify-center p-10 rounded-[2rem] border-2 border-red-600/50">
            <h3 class="text-white font-black text-xl mb-6 uppercase tracking-widest text-red-600">Configuração API</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Utilizador (Ex: azag666)</label>
                    <input type="text" id="ghUser" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Repositório (Ex: xvid)</label>
                    <input type="text" id="ghRepo" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Token PAT</label>
                    <input type="password" id="ghToken" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none focus:border-red-600">
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button type="button" onclick="toggleConfig()" class="flex-1 bg-slate-800 text-white p-3 rounded-xl font-bold uppercase text-xs">Sair</button>
                <button type="button" onclick="saveConfig()" class="flex-1 bg-red-600 text-white p-3 rounded-xl font-bold uppercase text-xs">Guardar</button>
            </div>
        </div>

        <div>
            <label class="block text-[11px] font-black text-slate-500 mb-2 uppercase text-center">URL do Site Alvo</label>
            <input type="url" id="videoUrl" required class="w-full bg-slate-900 border border-slate-800 text-white text-sm rounded-xl p-4 focus:ring-2 focus:ring-red-600 outline-none" placeholder="Cole o link do vídeo ou categoria">
        </div>

        <button type="button" onclick="toggleConfig()" class="text-slate-500 hover:text-white text-[10px] font-black uppercase flex items-center gap-2">
            <i class="fa-solid fa-gear"></i> Configurar API
        </button>

        <button type="submit" id="btnEnviar" class="w-full text-white bg-red-600 hover:bg-red-700 font-black rounded-xl text-lg py-4 shadow-xl transition-all active:scale-95">
            <span id="btnText">DISPARAR AGORA <i class="fa-solid fa-paper-plane ml-2"></i></span>
            <div id="loadingSpinner" class="hidden flex items-center justify-center gap-3">
                <div class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full loader"></div>
                <span>A ENVIAR...</span>
            </div>
        </button>
    </form>
    <div id="statusMsg" class="mt-4 text-[10px] hidden p-3 rounded-xl font-bold text-center border uppercase tracking-widest"></div>
</div>

<script>
    // FUNÇÃO QUE LIMPA URLS E DEIXA APENAS O NOME DO USER/REPO
    function sanitize(val) {
        if (!val) return "";
        let clean = val.trim().replace(/\/$/, ""); // Remove barra no final
        if (clean.includes("github.com/")) {
            const parts = clean.split("github.com/")[1].split("/");
            return parts[1] || parts[0]; // Tenta pegar o nome após a barra
        }
        return clean.split("/").pop(); // Pega apenas a última parte se houver barras
    }

    window.onload = () => {
        ['ghUser', 'ghRepo', 'ghToken'].forEach(f => {
            if(localStorage.getItem(f)) document.getElementById(f).value = localStorage.getItem(f);
        });
    };

    function toggleConfig() { document.getElementById('configArea').classList.toggle('hidden'); }

    function saveConfig() {
        // Aplica a limpeza antes de guardar
        const user = sanitize(document.getElementById('ghUser').value);
        const repo = sanitize(document.getElementById('ghRepo').value);
        const token = document.getElementById('ghToken').value.trim();

        document.getElementById('ghUser').value = user;
        document.getElementById('ghRepo').value = repo;

        localStorage.setItem('ghUser', user);
        localStorage.setItem('ghRepo', repo);
        localStorage.setItem('ghToken', token);
        toggleConfig();
        showStatus('API Configurada!', 'success');
    }

    document.getElementById('disparoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = localStorage.getItem('ghUser');
        const repo = localStorage.getItem('ghRepo');
        const token = localStorage.getItem('ghToken');
        const url = document.getElementById('videoUrl').value.trim();

        if(!user || !repo || !token) { showStatus('Erro: Configure a API!', 'error'); return; }

        setLoading(true);
        try {
            // URL DA API AGORA É MONTADA DE FORMA SEGURA
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/dispatches`;
            console.log("Chamando:", apiUrl);

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `token ${token}`
                },
                body: JSON.stringify({
                    event_type: 'iniciar_disparo',
                    client_payload: { video_url: url, button_link: 'internal_pix' }
                })
            });

            if (response.status === 204) {
                showStatus('✅ Sucesso! Verifique as Actions do GitHub.', 'success');
                document.getElementById('videoUrl').value = '';
            } else {
                const data = await response.json();
                showStatus(`❌ Erro: ${data.message}`, 'error');
            }
        } catch (error) {
            showStatus(`❌ Erro de Rede: Verifique o Token ou Internet`, 'error');
        } finally { setLoading(false); }
    });

    function setLoading(isLoading) {
        document.getElementById('btnEnviar').disabled = isLoading;
        document.getElementById('btnText').classList.toggle('hidden', isLoading);
        document.getElementById('loadingSpinner').classList.toggle('hidden', !isLoading);
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = `mt-4 text-[10px] p-3 rounded-xl font-bold text-center border uppercase tracking-widest ${type === 'success' ? 'bg-green-500/10 text-green-500 border-green-500/20' : 'bg-red-500/10 text-red-500 border-red-500/20'}`;
        el.classList.remove('hidden');
    }
</script>
</body>
</html>
